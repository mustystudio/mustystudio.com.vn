<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MUSTY STUDIO | Recycled & Handmade</title>

    <meta name="description" content="MUSTY STUDIO - Túi tái chế, hàng tự may và những thiết kế độc bản.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- ================= HEADER ================= -->

<header class="header">

    <a href="#home" class="logo">

        <span class="logo-name">MUSTY STUDIO</span>
    </a>

    <!-- MENU -->
    <nav class="nav" id="mainNav">

        <a href="#home" class="active">Trang chủ</a>

        <a href="#about">Giới thiệu</a>

    <div class="header-actions">

        <button class="menu-btn"
